name: global_library
description: A premium book discovery and reading companion powered by Open Library.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  pdfx: ^2.11.0
  flutter_epub_viewer: ^2.2.1
  sqflite: ^2.4.5+1
  path_provider: ^2.1.6
  sqflite_common: ^2.5.16
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/global_library_logo.jpeg
